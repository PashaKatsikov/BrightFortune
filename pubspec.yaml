name: bright_fortune
description: "Bright Fortune - a magical active tower defense game."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.34.0
  shared_preferences: ^2.5.3
  webview_flutter: ^4.13.0
  audioplayers: ^6.5.1
  url_launcher: ^6.3.2
  appsflyer_sdk: ^6.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/game/sprites/
    - assets/game/backgrounds/
    - assets/game/ui/
    - assets/Bright_Fortune_sounds_assets/

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf

flutter_launcher_icons:
  android: true
  image_path: "assets/Bright_Fortune_additional_assets/Icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2A1550"
  adaptive_icon_foreground: "assets/Bright_Fortune_additional_assets/Icon.png"

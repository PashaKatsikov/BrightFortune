name: bright_fortune
description: "Defend the bright fortress: raise towers, ring the blessing bells and hold back waves of gloom across five magical orchard lands."
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Native game ──
  flame: ^1.34.0
  audioplayers: ^6.5.1

  # ── Relay flow stack ──
  # Attribution / messaging pins must stay at or above the floors in
  # .cursor/rules/gray_part_pitfalls.md §19 — never downgrade them.
  # ⚠️ Do NOT add file_picker 10.x (Kotlin-only KGP clash, §1); the
  # WebView file chooser goes over a MethodChannel instead.
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.13.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.1.1
  appsflyer_sdk: ^6.18.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  firebase_app_check: ^0.4.5
  flutter_local_notifications: ^22.0.1
  flutter_secure_storage: ^10.3.1
  device_info_plus: ^11.4.0
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # Used only by tool/gen_icon.dart to build the launcher layers.
  image: ^4.5.4

flutter:
  uses-material-design: true

  assets:
    - assets/game/sprites/
    - assets/game/backgrounds/
    - assets/game/ui/
    - assets/Bright_Fortune_sounds_assets/
    # Boot / no-connection / push-invite artwork. The folder segment
    # ships in the APK, so it stays unique to this project.
    - assets/Bright_Fortune_additional_assets/

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf

# Layers come from tool/gen_icon.dart — run it before this tool:
#   dart run tool/gen_icon.dart && dart run flutter_launcher_icons
# The 16% inset puts the artwork at ~73dp of the 108dp adaptive
# canvas; the background is the artwork's own border colour.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/generated/app_icon.png"
  min_sdk_android: 26
  adaptive_icon_background: "assets/generated/app_icon_background.png"
  adaptive_icon_foreground: "assets/generated/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 16
